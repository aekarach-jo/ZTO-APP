name: zto_app
description: "ZTO Mobile App"
publish_to: 'none'

version: 1.3.8+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  easy_localization: ^3.0.7+1
  flutter_screenutil: ^5.9.3
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.4
  google_maps_flutter: ^2.13.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.7
  flutter_local_notifications: ^22.2.0
  socket_io_client: ^3.1.6
  qr_flutter: ^4.1.0
  gal: ^2.3.0
  path_provider: ^2.1.4
  barcode_widget: ^2.0.4
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  build_runner: ^2.5.4
  freezed: ^3.2.3
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/legal/
    - .env
    - .env.dev
    - .env.staging
    - .env.prod
